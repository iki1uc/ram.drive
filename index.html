:root{
  --bg:#050507;
  --surface:#0c0c10;
  --surface2:#121218;
  --line:#2a2a2a;
  --gold:#ffd700;
  --gold2:#fff1a8;
  --neon-green:#39ff88;
  --cyan:#00ccff;
  --neon-red:#ff2e4d;
  --mist:#9aa8a0;
  --text:#f2f4ef;
  --muted:#a9b8ad;
}

@media (prefers-color-scheme: dark){
  :root{
    --bg:#050507;
    --surface:#0c0c10;
    --text:#f2f4ef;
  }
}

*{
  box-sizing:border-box;
}

html{
  background:var(--bg);
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Consolas, ui-monospace, "Courier New", monospace;
}

.font-display{
  font-family:"Unbounded", system-ui, sans-serif;
}

button{
  cursor:pointer;
}

button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible{
  outline:3px solid var(--gold);
  outline-offset:3px;
}

input[type="range"]{
  accent-color:var(--gold);
}

@keyframes blink{
  0%,55%{
    opacity:1
  }

  56%,100%{
    opacity:.25
  }
}

.blink{
  animation:blink 1s steps(1) infinite;
}

.muted{
  color:var(--muted);
}

.card{
  max-width:640px;
  padding:16px;
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:6px;
}

.controls{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  align-items:center;
}

.controls button{
  min-height:48px;
}

.prisma{
  display:flex;
  height:14px;
  border-radius:4px;
  overflow:hidden;
  margin:8px 0;
}

.prisma div{
  flex:1;
}

.prisma-1{
  background:#f00;
}

.prisma-2{
  background:#f80;
}

.prisma-3{
  background:#ff0;
}

.prisma-4{
  background:#0a0;
}

.prisma-5{
  background:#00f;
}

.prisma-6{
  background:#80f;
}

.ebene-buttons{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
}

.ebene-buttons button{
  min-height:48px;
}

input[type=range]{
  width:100%;
  max-width:320px;
}

@media (max-width: 480px){
  .controls{
    flex-direction:column;
    align-items:stretch;
  }

  .controls button{
    width:100%;
    min-height:48px;
  }

  .card{
    max-width:100%;
  }

  .ebene-buttons{
    flex-direction:column;
  }

  .ebene-buttons button{
    width:100%;
  }
}
